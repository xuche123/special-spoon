spring:
  application:
    name: pdfbox-service
  config:
    import: classpath:templates.yml

server:
  error:
    include-message: never

pdf:
  preview:
    enabled: false
  limits:
    max-request-body-bytes: 1048576
    max-fields: 100
    max-text-code-points: 100000
    max-generated-pdf-bytes: 26214400

management:
  endpoints:
    web:
      exposure:
        include: health,info
